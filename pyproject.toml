[tool.poetry]
name = "future-vision-transport"
version = "0.1.0"
description = "Comparaison de modèles de segmentation sémantique sur GPU Intel XPU"
authors = ["Équipe R&D Future Vision Transport"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
torch = {version = "2.7.1+XPU", source = "pytorch-xpu"}
torchvision = {version = "0.22.1+XPU", source = "pytorch-xpu"}
torchaudio = {version = "2.7.1+XPU", source = "pytorch-xpu"}
pytorch-triton-xpu = { version = "3.3.1", source = "pytorch-xpu" }
numpy = "^2.0"
pandas = "^2.2"
matplotlib = "^3.9"
pillow = "^11.0"
opencv-python-headless = "^4.10"
albumentations = "^2.0"
scikit-learn = "^1.6"
mlflow = "^3.0"
segmentation-models-pytorch = "^0.5"
transformers = "^4.50"
timm = "^1.0"
jupyterlab = "^4.3"
ipykernel = "^6.29"
fastapi = "^0.141.1"
uvicorn = "^0.52.1"
gunicorn = "^26.0.0"
uvicorn-worker = "^0.4.0"
python-multipart = "^0.0.32"
pydantic-settings = "^2.15.0"

[[tool.poetry.source]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
